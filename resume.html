<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headshot & Resume - Isabelle Rashkin</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6f2, #e6f7ff, #fff0e6);
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: float linear infinite;
      opacity: 0.6;
      border-radius: 4px;
      z-index: 1;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      background: pink;
      border-radius: 50%;
    }
    .heart::before {
      top: -50%;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .heart::after {
      left: -50%;
      top: 0;
      width: 100%;
      height: 100%;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
    }

    /* Navbar */
    nav {
      background-color: #000;
      padding: 1rem;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
    }
    nav a {
      color: #fff;
      margin: 0 0.5rem;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* Page Content */
    main {
      margin-top: 100px; /* space for navbar */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2rem;
      z-index: 10;
      position: relative;
      padding: 1rem;
    }

    /* Resume Viewer */
    .resume-wrapper {
      position: relative;
      flex: 1 1 400px;
      max-width: 600px;
      min-width: 300px;
      height: 500px;
    }
    .resume-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
    .download-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: #f8c8dc;
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .resume-wrapper:hover .download-btn {
      opacity: 1;
    }

    /* Headshots */
    .headshots {
      display: flex;
      flex: 1 1 300px;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }
    .headshots img {
      width: 48%;
      min-width: 200px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      object-fit: cover;
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
        align-items: center;
      }
      .headshots {
        flex-direction: column;
        gap: 1rem;
      }
      .headshots img {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <div class="heart" style="left: 10%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 0s;"></div>
  <div class="heart" style="left: 40%; width: 25px; height: 25px; animation-duration: 14s; animation-delay: 2s;"></div>
  <div class="heart" style="left: 70%; width: 30px; height: 30px; animation-duration: 16s; animation-delay: 4s;"></div>
  <div class="heart" style="left: 85%; width: 22px; height: 22px; animation-duration: 18s; animation-delay: 1s;"></div>

  <!-- Navbar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="art.html">Original Visual Art</a>
    <a href="music.html">Original Music</a>
    <a href="theatre.html">Miscellania Theatre Co</a>
    <a href="resume.html">Headshot & Resume</a>
    <a href="gallery.html">Media Gallery</a>
    <a href="contact.html">Contact Me</a>
    <a href="something-silly.html">Something Silly</a>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Resume -->
    <div class="resume-wrapper">
      <iframe src="resume.pdf" class="resume-frame"></iframe>
      <a href="resume.pdf" download class="download-btn">⬇ Download</a>
    </div>

    <!-- Headshots -->
    <div class="headshots">
      <img src="headshot1.jpeg" alt="Headshot 1">
      <img src="headshot2.jpg" alt="Headshot 2">
    </div>
  </main>

</body>
</html>
